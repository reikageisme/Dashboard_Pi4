<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pi Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background-color: #1a1a1a; border: 1px solid #333; width: 100%; max-width: 400px; box-shadow: 0 0 20px rgba(220, 53, 69, 0.2); }
        .form-control { background-color: #000; border-color: #333; color: #fff; }
        .form-control:focus { background-color: #111; border-color: #dc3545; box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.25); color: #fff; }
        .btn-primary { background-color: #dc3545; border-color: #dc3545; }
        .btn-primary:hover { background-color: #bb2d3b; border-color: #b02a37; }
    </style>
</head>
<body>
    <div class="card p-4">
        <div class="text-center mb-4">
            <h1 class="display-6"><i class="fa-brands fa-raspberry-pi text-danger"></i> Login</h1>
            <p class="text-muted">Access Restricted</p>
        </div>
        
        <div id="alert" class="alert alert-danger d-none"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" id="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Unlock Dashboard</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            
            const res = await fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            });
            const data = await res.json();
            
            if(data.success) {
                window.location.href = '/';
            } else {
                const alert = document.getElementById('alert');
                alert.textContent = "Access Denied: " + data.error;
                alert.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
