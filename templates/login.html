<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pi Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: url('/static/images/bg.jpg') no-repeat center center fixed !important;
            background-size: cover !important;
            overflow: hidden;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: rgba(20, 20, 20, 0.6) !important;
            backdrop-filter: blur(20px) !important;
            -webkit-backdrop-filter: blur(20px) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37) !important;
            border-radius: 20px;
            color: #f0f0f0;
            padding: 2.5rem;
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .form-control {
            background: rgba(0, 0, 0, 0.4) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: white !important;
            border-radius: 10px;
            padding: 10px 15px;
        }
        .form-control:focus {
            background: rgba(0, 0, 0, 0.6) !important;
            border-color: #0d6efd !important;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25) !important;
        }
        .btn-primary {
            background-color: #0d6efd;
            border: none;
            font-weight: 600;
            padding: 0.75rem;
            border-radius: 10px;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            background-color: #0b5ed7;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(13, 110, 253, 0.4);
        }
        .input-group-text {
             background: rgba(255, 255, 255, 0.05);
             border: 1px solid rgba(255, 255, 255, 0.1);
             color: #aaa;
             border-radius: 10px;
        }
        .fa-raspberry-pi {
            font-size: 3.5rem; 
            margin-bottom: 1rem;
            filter: drop-shadow(0 0 15px rgba(220, 53, 69, 0.6));
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .alert {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid rgba(220, 53, 69, 0.3);
            color: #ffcccc;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <div class="login-card text-center">
        <div class="mb-4">
            <i class="fa-brands fa-raspberry-pi text-danger"></i>
            <h3 class="fw-bold mt-2">Welcome Back</h3>
            <p class="text-secondary small">Sign in to your Dashboard</p>
        </div>
        
        <div id="alert" class="alert d-none p-2 mb-3 small rounded"></div>

        <form id="loginForm" class="text-start">
            <div class="mb-3">
                <label class="form-label small text-uppercase text-secondary fw-bold ms-1" style="font-size: 0.7rem;">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                    <input type="text" id="username" class="form-control" placeholder="Enter username" required autofocus>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label small text-uppercase text-secondary fw-bold ms-1" style="font-size: 0.7rem;">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="password" class="form-control" placeholder="Enter password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3 shadow-lg">Sign In</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const btn = this.querySelector('button');
            const alertBox = document.getElementById('alert');
            
            // Loading State
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Verifying...';
            btn.disabled = true;
            alertBox.classList.add('d-none');

            fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            })
            .then(response => response.json())
            .then(data => {
                if(data.success) {
                    btn.innerHTML = '<i class="fa-solid fa-check"></i> Success';
                    btn.classList.replace('btn-primary', 'btn-success');
                    // Reload to redirect cleanly
                    window.location.reload();
                } else {
                    throw new Error(data.error || 'Invalid credentials');
                }
            })
            .catch(err => {
                console.error(err);
                alertBox.textContent = err.message || 'Connection error';
                alertBox.classList.remove('d-none');
                btn.innerHTML = originalText;
                btn.disabled = false;
                
                // Shake effect
                const card = document.querySelector('.login-card');
                card.animate([
                    { transform: 'translateX(0)' },
                    { transform: 'translateX(-10px)' },
                    { transform: 'translateX(10px)' },
                    { transform: 'translateX(0)' }
                ], { duration: 300 });
            });
        });
    </script>
</body>
</html>
